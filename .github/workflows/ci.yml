name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types, format, dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Types
        run: npx tsc --noEmit

      - name: Formatting
        run: npx prettier --check "src/**/*.ts"

      # dist/ is committed and is what actually executes on a runner, with sudo, before any
      # workflow step. A stale bundle ships code that nobody reviewed, and nothing else in the
      # repository would notice. ncc output is fixed by the version pinned in package-lock.json
      # rather than by the Node version (verified identical on Node 20, 24 and 26), so this
      # comparison is stable rather than flaky.
      - name: Rebuild dist
        run: |
          npm run build
          npm run build:pre
          npm run build:post

      - name: dist must match src
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ does not match src/. Run 'npm run package' and commit dist/."
            git diff --stat -- dist/
            exit 1
          fi
          echo "dist/ matches src/"
